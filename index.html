ect.input{cursor:pointer;color:var(--cream)}select.input option{background:#192c49;color:#fff}.wide{width:100%;margin-top:20px}.notice{background:#ffce8b12;border:1px solid #ffd18b55;border-radius:12px;color:#ffddb0;font-size:13px;line-height:1.7;padding:11px 13px;margin-top:16px}.result{text-align:center}.pin{font-size:52px;font-weight:800;letter-spacing:7px;color:#ffd879;margin:9px 0}.muted{color:#b7c9db}.footer{text-align:center;color:#8198b2;font-size:12px;margin-top:45px}@media(max-width:750px){.hero{grid-template-columns:1fr;margin-top:38px}.hero h1{font-size:49px}.visual{min-height:310px}.orbit{width:290px}.monitor{height:118px}.monitor span{font-size:49px}.cards{grid-template-columns:1fr}.shell{padding:18px 20px 40px}.pill{font-size:10px}.actions .btn{flex:1;min-width:130px;padding:15px 12px;font-size:15px}}

.lobby{margin-top:22px;background:#172b46;border:1px solid #54718a77;border-radius:22px;padding:24px;box-shadow:0 15px 45px #08142666}.lobby-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.lobby h2{margin:0;color:#fff5e8}.lobby-pin{font-size:clamp(34px,7vw,65px);font-weight:800;letter-spacing:9px;color:#ffd879;margin:12px 0}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:18px 0}.player{background:#263e5b;border:1px solid #60768e66;border-radius:13px;padding:12px;color:#fff5e8;font-weight:600}.player small{display:block;color:#9fb5ca;font-weight:400}.lobby-actions{display:flex;gap:10px;flex-wrap:wrap}.lobby-actions .btn{min-width:160px}.demo-hint{color:#ffdda9;font-size:13px;line-height:1.6}.hidden{display:none!important}

.answer.correct-reveal{background:#168a63!important;border-color:#73ffd0!important;color:#fff!important;opacity:1!important}.answer.wrong-reveal{background:#8d344b!important;border-color:#ff9ca9!important;color:white!important;opacity:1!important}.answer.dimmed{opacity:.48!important}.reveal-panel{position:relative;overflow:hidden;margin:18px 0 8px;padding:20px;border:2px solid #ffce8b;border-radius:18px;background:linear-gradient(135deg,#263c5d,#15283f);text-align:center}.reveal-title{font-size:clamp(24px,4vw,37px);font-weight:800;color:#ffda87}.reveal-desc{font-size:17px;color:#fff4e4;margin:8px 0}.reveal-score{display:inline-block;background:#ff946f;color:#14253c;padding:8px 18px;border-radius:30px;font-weight:800}.confetti-layer{pointer-events:none;position:fixed;inset:0;z-index:20;overflow:hidden}.confetti-piece{position:absolute;top:-35px;width:11px;height:19px;opacity:0;animation:confetti-fall 2.7s ease-in forwards}@keyframes confetti-fall{0%{transform:translate3d(0,-10px,0) rotate(0);opacity:1}100%{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot));opacity:0}}@media(prefers-reduced-motion:reduce){.confetti-piece{animation:none}}

/* Refresh: Coral Arcade UI */
:root{--navy:#101d34;--navy2:#1a304e;--panel:#233c5b;--coral:#ff9679;--coral2:#ff756b;--gold:#ffe29a}
body{background:radial-gradient(circle at 85% 10%,#345574 0%,transparent 38%),radial-gradient(circle at 10% 85%,#3d2e4c 0%,transparent 35%),linear-gradient(155deg,#101b30,#142b48 70%,#101d34)}

.overlay{background:#06101cbb;backdrop-filter:blur(13px);padding:16px}.modal{width:min(100%,520px);border:1px solid #9cbed855;background:linear-gradient(148deg,#2b4768,#192d4a 78%);box-shadow:0 25px 80px #0009,0 0 0 6px #ffffff06;border-radius:30px;padding:38px}

.quiz-top{align-items:center;border-bottom:1px solid #ffffff1b;padding-bottom:15px}.timer{padding:7px 16px;border-radius:99px;background:#ff96751d;border:1px solid #ffb38b77;color:#ffd6aa}

/* Character selection and animated award stage */
.avatar-choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:12px 0;max-height:320px;overflow-y:auto;padding:5px;scrollbar-color:#ff9679 #182b46}.avatar-choice{background:#13263f;border:2px solid #52657d;border-radius:17px;padding:8px 4px;cursor:pointer;color:#fff;font:inherit;text-align:center}.avatar-choice.selected{border-color:#ffac86;background:#3c3b51;box-shadow:0 0 0 2px #ff946f30}.avatar-choice .avatar-art{width:65px;height:76px;margin:auto}.avatar-choice small{display:block;font-size:11px;color:#cbd9e9}.avatar-art{width:100px;height:116px;display:block;filter:drop-shadow(0 6px 8px #0005)}.award-stage{min-height:390px;position:relative;overflow:hidden;border-radius:22px;background:radial-gradient(ellipse at 50% 25%,#415778 0%,#172944 55%,#101c30 100%);border:1px solid #61738a;padding:22px 10px;text-align:center}.award-heading{font-size:clamp(22px,4vw,36px);color:#ffe1b6;margin:4px 0}.award-intro{color:#c7d8e9;font-size:14px}.award-spot{display:flex;align-items:flex-end;justify-content:center;gap:clamp(5px,2vw,20px);height:275px;margin:12px auto 0;max-width:720px}.award-contender{width:31%;max-width:205px;display:flex;flex-direction:column;align-items:center;opacity:.16;transform:translateY(35px) scale(.87);transition:transform .85s cubic-bezier(.2,1.3,.4,1),opacity .85s}.award-contender.revealed{opacity:1;transform:translateY(0) scale(1)}.award-contender .avatar-art{width:clamp(60px,11vw,100px);height:clamp(75px,12vw,112px)}.award-name{color:#fff;font-weight:700;font-size:clamp(12px,2.4vw,18px);max-width:100%;overflow-wrap:anywhere}.award-score{color:#ffe0a3;font-size:12px}.award-pillar{width:100%;display:grid;place-items:center;border-radius:13px 13px 4px 4px;font-size:clamp(29px,5vw,56px);font-weight:900;box-shadow:inset 0 7px 14px #fff2,0 15px 25px #0005}.award-pillar.silver{height:91px;background:linear-gradient(#a7b9cf,#586d87)}.award-pillar.gold{height:137px;background:linear-gradient(#ffe08d,#d49342);color:#4d3315}.award-pillar.bronze{height:68px;background:linear-gradient(#d89b7d,#915c4d)}.award-footer{margin:16px auto 0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.award-overview{animation:fadeAward .7s both}@keyframes fadeAward{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.avatar-player{display:inline-flex;align-items:center;gap:8px}.avatar-player .avatar-art{width:36px;height:42px}.award-confetti{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#ffd879 2px,transparent 3px),radial-gradient(#ff946f 2px,transparent 3px),radial-gradient(#8ee2e6 2px,transparent 3px);background-size:64px 71px,91px 82px,78px 90px;animation:awardFall 2.8s linear infinite;opacity:.65}@keyframes awardFall{from{background-position:0 -120px,0 -70px,0 -170px}to{background-position:0 250px,0 300px,0 200px}}@media(prefers-reduced-motion:reduce){.award-contender,.award-overview,.award-confetti{animation:none;transition:none}}
@media(max-width:560px){.avatar-choices{grid-template-columns:repeat(3,minmax(0,1fr));max-height:290px}.avatar-choice .avatar-art{width:56px;height:68px}.avatar-choice small{font-size:10px}.overlay .modal{max-height:92vh;overflow-y:auto}}

/* Character dress-up studio */
.dress-studio{background:#101e34;border:1px solid #6482a0;border-radius:20px;padding:18px;margin:16px 0}.dress-studio h3{margin:0;color:#ffdab3;font-size:21px}.dress-studio p{font-size:13px;color:#c3d6e7;margin:5px 0 12px}.dress-preview{display:grid;place-items:center;min-height:170px;background:radial-gradient(circle,#385776,#192b47 75%);border-radius:18px;margin:12px 0}.dress-preview .avatar-art{width:145px;height:165px}.dress-control{padding:11px 0;border-top:1px solid #ffffff18}.dress-label{font-size:14px;color:#ffe4c8;font-weight:600;margin-bottom:8px}.dress-options{display:flex;gap:7px;flex-wrap:wrap}.dress-option{font:500 12px Kanit,system-ui;color:white;border:2px solid #647c97;background:#2b4665;min-height:35px;min-width:35px;padding:5px 8px;border-radius:11px;cursor:pointer}.dress-option.active{border-color:#ffd47e;box-shadow:0 0 0 2px #ff96794d;background:#4a5472}.dress-swatch{display:block;width:22px;height:22px;border-radius:7px;border:1px solid #ffffff88}.dress-reset{width:100%;background:#263e5c;color:white;border:1px solid #9ab0c6;border-radius:12px;padding:10px;font:600 14px Kanit;cursor:pointer;margin-top:13px}

/* In-game notifications: replace browser alerts with coral/navy UI */
.arena-toast-zone{position:fixed;top:22px;right:22px;z-index:100;display:grid;gap:12px;width:min(380px,calc(100vw - 32px));pointer-events:none}
.arena-toast{pointer-events:auto;display:flex;gap:13px;align-items:center;background:linear-gradient(125deg,#2c4666,#142841);color:#fff7ec;border:1px solid #ffbb91aa;border-left:5px solid #ff9b76;box-shadow:0 18px 55px #02091699;border-radius:18px;padding:16px;animation:toastIn .25s ease both}
.arena-toast.success{border-left-color:#6de1bb}.arena-toast.warning{border-left-color:#ffd879}

.arena-toast-copy{flex:1;min-width:0}.arena-toast-copy strong{display:block;color:#ffe0b1;font-size:16px}.arena-toast-copy span{font-size:13px;color:#cbdbea;line-height:1.5}
.arena-toast-close{background:#ffffff15;border:0;color:white;border-radius:9px;font-size:19px;width:29px;height:29px;cursor:pointer}
.arena-dialog-backdrop{position:fixed;inset:0;background:#040c19c9;backdrop-filter:blur(9px);z-index:101;display:grid;place-items:center;padding:16px}
.arena-dialog{width:min(430px,100%);background:linear-gradient(145deg,#304b6b,#152943);border:1px solid #ffb18c8a;border-radius:27px;box-shadow:0 25px 80px #000b;padding:30px;text-align:center;animation:dialogIn .23s ease both}
.arena-dialog-symbol{margin:auto auto 12px;width:62px;height:62px;display:grid;place-items:center;border-radius:20px;background:#ff98762b;color:#ffd5aa;font-size:30px}
.arena-dialog h3{font-size:25px;margin:0 0 8px;color:#ffe1b5}.arena-dialog p{color:#c9d9e9;margin:0 0 24px;line-height:1.6}
.arena-dialog-actions{display:flex;gap:10px}.arena-dialog-actions .btn{flex:1;min-width:0;padding:13px;font-size:15px}

function playTone(freq,duration=.18,volume=.035){if(!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type='triangle';osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(volume,now+.015);gain.gain.exponentialRampToValueAtTime(.001,now+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.02)}

function joinRoom(){const pin=document.getElementById('pin').value.trim(),name=document.getElementById('nickname').value.trim();const r=getRoom();if(!/^\d{6}$/.test(pin)||!name){showFormError('กรุณากรอก PIN 6 หลักและชื่อนักเรียน');return}if(!r||r.pin!==pin){showFormError('ไม่พบห้องนี้ กรุณาตรวจสอบ PIN');return}if(r.status!=='waiting'){showFormError('ห้องนี้เริ่มเกมแล้ว');return}if(r.players.includes(name)){showFormError('ชื่อนี้มีคนใช้แล้ว ลองชื่ออื่น');return}role='student';myName=name;sessionStorage.setItem('arena_role','student');sessionStorage.setItem('arena_name',name);r.players.push(name);r.scores[name]=0;r.avatars=r.avatars||{};r.avatars[name]={...avatarStyle};sessionStorage.setItem('arena_avatar',JSON.stringify(avatarStyle));saveRoom(r);hide();lobby.scrollIntoView({behavior:'smooth',block:'start'})}

 zone.innerHTML='';const item=document.createElement('div');item.className='arena-toast '+kind;
 const symbol=kind==='success'?'✓':kind==='warning'?'!':'i';
 item.innerHTML=`<div class="arena-toast-icon">${symbol}</div><div class="arena-toast-copy"><strong></strong><span></span></div><button class="arena-toast-close" aria-label="ปิดข้อความ">×</button>`;
 item.querySelector('strong').textContent=title;item.querySelector('span').textContent=message;item.querySelector('button').onclick=()=>item.remove();zone.appendChild(item);

async function copyPIN(){const r=getRoom();if(!r)return;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(r.pin)}else{const field=document.createElement('textarea');field.value=r.pin;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();if(!document.execCommand('copy'))throw Error('copy');field.remove()}arenaToast('คัดลอก PIN สำเร็จ','รหัสห้อง '+r.pin+' พร้อมส่งให้นักเรียน','success')}catch(e){arenaToast('คัดลอกอัตโนมัติไม่ได้','รหัสห้องคือ '+r.pin+' กรุณาคัดลอกจากหน้าห้อง','warning')}}

const syncChannel=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('hardware-arena-sync-v5'):null;
let lastScreenKey='',lastRoomSnapshot='';
function refreshGameState(force=false){
 const r=getRoom();
 if(role==='student'&&(!r||!r.players.includes(myName))){role='';myName='';sessionStorage.removeItem('arena_role');sessionStorage.removeItem('arena_name')}
 updateScreen();
 const snapshot=JSON.stringify(r);
 if(!force&&snapshot===lastRoomSnapshot)return;
 lastRoomSnapshot=snapshot;
 const screenKey=!role||!r?'home':r.status==='waiting'?'waiting':r.status==='finished'?'finished':'question:'+r.index;
 const screenChanged=screenKey!==lastScreenKey;
 lastScreenKey=screenKey;
 renderLobby();renderQuiz();
 if(screenChanged&&role&&r){
  const target=r.status==='waiting'?lobby:quiz;
  if(!target.classList.contains('hidden'))requestAnimationFrame(()=>target.scrollIntoView({behavior:'smooth',block:'start'}));
 }
}
if(syncChannel)syncChannel.onmessage=e=>{if(e.data?.type==='room-updated')refreshGameState(true)};
window.addEventListener('storage',e=>{if(e.key===KEY)refreshGameState(true)});
window.addEventListener('focus',()=>refreshGameState(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshGameState(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
// Polling fallback for browsers where file:// storage events do not reliably fire.
setInterval(()=>refreshGameState(),450);

refreshGameState(true);

function safeScore(r,n){return Number(r.scores?.[n]||0)}
function ranking(r){return [...r.players].sort((a,b)=>safeScore(r,b)-safeScore(r,a))}
function submitAnswer(choice){const r=getRoom();if(!r||r.status!=='question'||role!=='student'||Date.now()>r.deadline||r.answers[myName])return;
 const elapsed=Math.max(0,10000-(r.deadline-Date.now()));const correct=choice===QUESTIONS[r.index].correct;
 const points=correct?Math.max(500,1000-Math.floor(elapsed/20)):0;
 r.answers[myName]={choice,points};r.scores[myName]=safeScore(r,myName)+points;saveRoom(r)}
function nextQuestion(){const r=getRoom();if(!r||role!=='host')return;if(Date.now()<r.deadline){arenaToast('ยังไม่หมดเวลา','รอให้ครบ 10 วินาทีก่อนเปลี่ยนข้อ','warning');return;}if(r.index>=QUESTIONS.length-1){r.status='finished';r.finishedAt=Date.now();awardSkip=false}else{r.index++;r.status='question';r.answers={};r.deadline=Date.now()+10000}saveRoom(r)}
function confettiBurst(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=document.createElement('div');layer.className='confetti-layer';document.body.appendChild(layer);const colors=['#ff946f','#ffd879','#73e8ff','#91f5bb','#fff5e8','#d9a8ff'];for(let i=0;i<100;i++){const piece=document.createElement('i');piece.className='confetti-piece';piece.style.left=(Math.random()*100)+'%';piece.style.background=colors[i%colors.length];piece.style.borderRadius=i%3===0?'50%':'2px';piece.style.animationDelay=(Math.random()*.55)+'s';piece.style.setProperty('--dx',(Math.random()*500-250)+'px');piece.style.setProperty('--rot',(Math.random()*1400-700)+'deg');layer.appendChild(piece)}setTimeout(()=>layer.remove(),3700)}
function awardStage(r){if(awardSkip)return 4;return Math.min(4,Math.floor((Date.now()-(r.finishedAt||Date.now()))/3800))}

function renderQuiz(){const r=getRoom();if(!r||!role||r.status==='waiting'){quiz.classList.add('hidden');return}quiz.classList.remove('hidden');
 if(r.status==='finished'){renderAwards(r);return}
 const q=QUESTIONS[r.index],myAnswer=r.answers[myName],expired=Date.now()>=r.deadline,answered=Object.keys(r.answers||{}).length;quiz.dataset.expired=expired?'1':'';
 const correctIndex=q.correct;const correctLetter=['A','B','C','D'][correctIndex];
 let reveal='';if(expired){let result='';if(role==='host'){result=`<div class="reveal-desc">มีผู้ตอบ ${answered}/${r.players.length} คน</div>`}else if(myAnswer?.choice===correctIndex){result=`<div class="reveal-title">🎉 ตอบถูกต้อง!</div><div class="reveal-desc">ยอดเยี่ยม! คุณตอบถูกในข้อนี้</div><div class="reveal-score">+${myAnswer.points.toLocaleString()} คะแนน</div>`}else{result=`<div class="reveal-title">❌ ${myAnswer?'ตอบผิด':'หมดเวลา'}</div><div class="reveal-desc">${myAnswer?'คำตอบนี้ยังไม่ถูกต้อง':'ไม่ได้ส่งคำตอบภายในเวลา'}</div><div class="reveal-score">+0 คะแนน</div>`}reveal=`<div class="reveal-panel"><div class="reveal-title">เฉลย: ${correctLetter}. ${escapeHTML(q.a[correctIndex])}</div><div class="reveal-desc">${escapeHTML(q.ex)}</div>${result}</div>`;
 if(role==='student'&&myAnswer?.choice===correctIndex){const key=r.pin+':'+r.index+':'+myName;if(lastCelebratedKey!==key){lastCelebratedKey=key;setTimeout(confettiBurst,100)}}}
 quiz.innerHTML=`<div class="quiz-top"><span>ข้อ ${r.index+1} / ${QUESTIONS.length}</span><span>${escapeHTML(r.name)}</span><span class="timer" id="clock">${Math.max(0,Math.ceil((r.deadline-Date.now())/1000))} วินาที</span></div>${questionArt(r.index)}<h2>${escapeHTML(q.q)}</h2><div class="quiz-answers">${q.a.map((a,i)=>`<button class="answer ${expired?(i===correctIndex?'correct-reveal':myAnswer?.choice===i?'wrong-reveal':'dimmed'):myAnswer?.choice===i?'picked':''}" ${role==='host'||myAnswer||expired?'disabled':''} onclick="submitAnswer(${i})">${['A','B','C','D'][i]}. ${escapeHTML(a)} ${expired&&i===correctIndex?'✓':expired&&myAnswer?.choice===i?'❌':''}</button>`).join('')}</div>${reveal}<div class="quiz-note">${expired?'หมดเวลาแล้ว · เฉลยแสดงด้านบน':role==='host'?`ครูควบคุมคำถาม · มีผู้ตอบแล้ว ${answered}/${r.players.length} คน`:myAnswer?'ส่งคำตอบแล้ว · รอหมดเวลาเพื่อดูเฉลย':'เลือกคำตอบที่ถูกต้องภายใน 10 วินาที'}</div>${role==='host'?`<button class="btn primary" ${!expired?'disabled title="รอหมดเวลา"':''} onclick="nextQuestion()">${r.index===QUESTIONS.length-1?'ดูผลการแข่งขัน':'ข้อถัดไป ➜'}</button>`:''}${expired&&role==='student'?`<div class="quiz-note" style="margin-top:14px;padding:12px 16px;background:#243b58;border-radius:12px;color:#ffd879;font-weight:700">คะแนนรวมสะสม: ${safeScore(r,myName).toLocaleString()} คะแนน</div>`:''}`;
}
setInterval(()=>{const r=getRoom();if(r?.status==='finished'&&role){const stage=awardStage(r);if(stage!==awardLastStage)renderAwards(r);return}if(!r||r.status!=='question'||!role)return;const c=document.getElementById('clock');if(c)c.textContent=Math.max(0,Math.ceil((r.deadline-Date.now())/1000))+' วินาที';if(Date.now()>=r.deadline&&!quiz.dataset.expired){quiz.dataset.expired='1';renderQuiz()}if(Date.now()<r.deadline)quiz.dataset.expired=''},500);
</script></body></html>
